apply plugin: 'com.android.application'

def releaseStoreFilePath = project.findProperty('HD_RELEASE_STORE_FILE') ?: System.getenv('HD_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('HD_RELEASE_STORE_PASSWORD') ?: System.getenv('HD_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('HD_RELEASE_KEY_ALIAS') ?: System.getenv('HD_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('HD_RELEASE_KEY_PASSWORD') ?: System.getenv('HD_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def acceptanceAssets = project.findProperty('HD_ACCEPTANCE_ASSETS')
def offlineLab = project.findProperty('HD_OFFLINE_LAB') == 'true'
if (offlineLab && !acceptanceAssets) throw new GradleException('Offline lab requires isolated assets.')
def localAppSuffix = project.findProperty('HD_LOCAL_APP_SUFFIX')
if (localAppSuffix && (!offlineLab || localAppSuffix != '.localdev')) throw new GradleException('Invalid isolated local application suffix')
def parallelRelease = project.findProperty('HD_PARALLEL_RELEASE') == 'true'
def parallelAssets = project.findProperty('HD_PARALLEL_ASSETS')
def parallelManifest = project.findProperty('HD_PARALLEL_MANIFEST')
if (parallelRelease && (acceptanceAssets || !parallelAssets || !parallelManifest)) {
    throw new GradleException('Parallel release requires its production assets/manifest and cannot use acceptance assets.')
}
gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task ->
        task.name.toLowerCase().contains('release')
    }

    if (releaseTaskRequested && !hasReleaseSigning) {
        throw new GradleException(
            'Release signing is required. Configure HD_RELEASE_STORE_FILE, HD_RELEASE_STORE_PASSWORD, ' +
            'HD_RELEASE_KEY_ALIAS, and HD_RELEASE_KEY_PASSWORD outside version control.'
        )
    }
    if (releaseTaskRequested && acceptanceAssets) {
        throw new GradleException('Isolated acceptance assets must never be packaged in a release.')
    }
}

android {
    namespace = "com.hdmanager.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hdmanager.app"
        if (acceptanceAssets) applicationIdSuffix offlineLab ? (localAppSuffix ?: ".offlinelab") : ".acceptance"
        if (parallelRelease) applicationIdSuffix ".next"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26110401
        versionName "1.0.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (acceptanceAssets) {
        sourceSets.main.assets.srcDirs = [file(acceptanceAssets)]
    }
    if (project.hasProperty('HD_OFFLINE_LAB_MANIFEST')) {
        if (!offlineLab || !acceptanceAssets) throw new GradleException('Local manifest requires isolated Offline Lab assets')
        sourceSets.main.manifest.srcFile file(project.property('HD_OFFLINE_LAB_MANIFEST'))
    }
    if (parallelRelease) {
        sourceSets.main.assets.srcDirs = [file(parallelAssets)]
        sourceSets.main.manifest.srcFile file(parallelManifest)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Same Webkit artifact already used by Capacitor; expose its startup API
    // to the Local-only debug launcher (no second provider or runtime).
    debugImplementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Release-like ART behavior for the isolated Local performance APK only.
// Keep the existing debug signing key; this is never an official release.
if (project.findProperty('HD_LOCAL_PROFILEABLE') == 'true') {
    if (!offlineLab || !acceptanceAssets || localAppSuffix != '.localdev') throw new GradleException('Profileable Local package required');
    android.buildTypes.debug.debuggable = false
    android.buildTypes.debug.jniDebuggable = false
}

// Explicit RC version overrides; defaults and Development builders remain
// unchanged. These properties cannot change package, alias or signing key.
if (project.hasProperty('HD_RELEASE_VERSION_CODE')) {
    def requestedCode = project.property('HD_RELEASE_VERSION_CODE').toString()
    if (!(requestedCode ==~ /[0-9]{1,10}/) || requestedCode.toLong() <= 26110401L || requestedCode.toLong() > 2100000000L) {
        throw new GradleException('Invalid official release versionCode')
    }
    android.defaultConfig.versionCode = requestedCode.toInteger()
}
if (project.hasProperty('HD_RELEASE_VERSION_NAME')) {
    def requestedName = project.property('HD_RELEASE_VERSION_NAME').toString()
    if (!(requestedName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) throw new GradleException('Invalid official release versionName')
    android.defaultConfig.versionName = requestedName
}
// Separate local package only; official package/version/signing stay untouched.
if (project.hasProperty('HD_LOCAL_DEV_VERSION_NAME')) {
    if (!offlineLab || !acceptanceAssets) throw new GradleException('Local version requires isolated Offline Lab assets')
    def localVersion = project.property('HD_LOCAL_DEV_VERSION_NAME').toString()
    def localCode = project.property('HD_LOCAL_DEV_VERSION_CODE').toString()
    if (!(localVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+-local-dev\.[0-9]+/) || !(localCode ==~ /[0-9]{1,9}/)) throw new GradleException('Invalid local Development version')
    android.defaultConfig.versionName = localVersion
    android.defaultConfig.versionCode = localCode.toInteger()
}

try {
    def servicesJSON = file('google-services.json')
    if (!acceptanceAssets && !parallelRelease && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
        apply plugin: 'com.google.firebase.firebase-perf'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Firebase Android observability plugins not applied. Push Notifications, Crashlytics and native Performance won't run")
}
