name: Deploy HD Manager

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Run functional test suite
        run: npm run test:all

      - name: Performance architecture audit
        run: npm run test:performance

      - name: Stress test
        run: npm run test:stress:big

      - name: KPI gate
        run: npm run test:kpi

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "Build successful"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hd-manager-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Package build artifact
        if: github.event_name == 'push'
        run: tar -czf hd-manager-dist.tgz -C dist .

      - name: Deploy to VPS
        if: github.event_name == 'push'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/hdmanager_vps
          chmod 600 ~/.ssh/hdmanager_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          REMOTE_TGZ="/tmp/hd-manager-dist-${RELEASE_ID}.tgz"
          REMOTE_DIR="/tmp/hd-manager-dist-${RELEASE_ID}"

          scp -i ~/.ssh/hdmanager_vps hd-manager-dist.tgz "${VPS_USER}@${VPS_HOST}:${REMOTE_TGZ}"
          ssh -i ~/.ssh/hdmanager_vps "${VPS_USER}@${VPS_HOST}" "set -euo pipefail
            rm -rf '${REMOTE_DIR}'
            mkdir -p '${REMOTE_DIR}'
            tar -xzf '${REMOTE_TGZ}' -C '${REMOTE_DIR}'
            docker run --rm \
              -v '${REMOTE_DIR}:/src:ro' \
              -v '/var/www/hd-manager:/target' \
              hdconnect-nginx:latest \
              sh -c 'rm -rf /target/* && cp -a /src/. /target/'
            rm -rf '${REMOTE_DIR}' '${REMOTE_TGZ}'
          "
