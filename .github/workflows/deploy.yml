name: Deploy HD Manager

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Functions production dependencies
        run: npm audit --prefix functions --omit=dev --audit-level=high

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run functional test suite
        run: npm run test:all

      - name: Verify Firestore payroll rules
        run: npm run test:firestore-payroll-rules

      - name: Verify Firestore tenant isolation
        run: npm run test:firestore-tenant-rules

      - name: Verify password recovery transaction
        run: npm run test:identity:firestore

      - name: Performance architecture audit
        run: npm run test:performance

      - name: Stress test
        run: npm run test:stress:big

      - name: KPI gate
        run: npm run test:kpi

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/index.html
          echo "Build successful"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v5
        with:
          name: hd-manager-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Create deployment package
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cd dist
          zip -qr ../hd-manager-dist.zip .
          cd ..
          test -s hd-manager-dist.zip
          ls -lh hd-manager-dist.zip

        - name: Calculate build SHA
          if: github.event_name == 'push'
          id: build-sha
          run: |
            set -euo pipefail
            INDEX_SHA="$(sha256sum dist/index.html | cut -d" " -f1)"
            echo "index_sha=${INDEX_SHA}" >> "$GITHUB_OUTPUT"
            echo "Build index SHA: ${INDEX_SHA}"

      - name: Upload frontend to VPS
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "hd-manager-dist.zip"
          target: "/tmp/"
          overwrite: true

        - name: Deploy frontend to VPS
          if: github.event_name == 'push'
          uses: appleboy/ssh-action@v1.2.2
          env:
            EXPECTED_INDEX_SHA: ${{ steps.build-sha.outputs.index_sha }}
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            envs: EXPECTED_INDEX_SHA
            script: |
              set -euo pipefail
              chmod 750 /home/hdmanager/deploy.sh
              EXPECTED_INDEX_SHA="${EXPECTED_INDEX_SHA}" /home/hdmanager/deploy.sh

        - name: Verify production serves this release
          if: github.event_name == 'push'
          run: |
            set -euo pipefail

            LOCAL_INDEX_SHA="$(sha256sum dist/index.html | cut -d' ' -f1)"

            PRODUCTION_INDEX_SHA="$(
              curl --fail --silent --show-error \
                --retry 3 \
                --retry-delay 2 \
                --header "Cache-Control: no-cache" \
                "https://app.hdconnect.net/index.html?release=${GITHUB_SHA}" |
                sha256sum |
                cut -d' ' -f1
            )"

            echo "Local index SHA:       ${LOCAL_INDEX_SHA}"
            echo "Production index SHA:  ${PRODUCTION_INDEX_SHA}"

            test "${LOCAL_INDEX_SHA}" = "${PRODUCTION_INDEX_SHA}"

            echo "Production verification successful"
