name: Deploy HD Manager

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Run functional test suite
        run: npm run test:all

      - name: Performance architecture audit
        run: npm run test:performance

      - name: Stress test
        run: npm run test:stress:big

      - name: KPI gate
        run: npm run test:kpi

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "Build successful"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hd-manager-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Package build artifact
        if: github.event_name == 'push'
        run: tar -czf hd-manager-dist.tgz -C dist .

      - name: Deploy to VPS
        if: github.event_name == 'push'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOCAL_INDEX_SHA="$(sha256sum dist/index.html | cut -d' ' -f1)"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/hdmanager_vps
          chmod 600 ~/.ssh/hdmanager_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          REMOTE_TGZ="/tmp/hd-manager-dist-${RELEASE_ID}.tgz"
          REMOTE_DIR="/tmp/hd-manager-dist-${RELEASE_ID}"
          APP_DIR="/var/www/hd-manager"
          RELEASE_DIR="${APP_DIR}/releases/${RELEASE_ID}"

          scp -i ~/.ssh/hdmanager_vps hd-manager-dist.tgz "${VPS_USER}@${VPS_HOST}:${REMOTE_TGZ}"
          ssh -i ~/.ssh/hdmanager_vps "${VPS_USER}@${VPS_HOST}" bash -s -- \
            "${REMOTE_TGZ}" "${REMOTE_DIR}" "${APP_DIR}" "${RELEASE_DIR}" "${LOCAL_INDEX_SHA}" "${RELEASE_ID}" <<'REMOTE_DEPLOY'
          set -euo pipefail
          REMOTE_TGZ="$1"
          REMOTE_DIR="$2"
          APP_DIR="$3"
          RELEASE_DIR="$4"
          EXPECTED_INDEX_SHA="$5"
          RELEASE_ID="$6"

          rm -rf "$REMOTE_DIR"
          mkdir -p "$REMOTE_DIR" "$RELEASE_DIR"
          tar -xzf "$REMOTE_TGZ" -C "$REMOTE_DIR"
          docker run --rm \
            -v "$REMOTE_DIR:/src:ro" \
            -v "$RELEASE_DIR:/target" \
            hdconnect-nginx:latest \
            sh -c 'rm -rf /target/* && cp -a /src/. /target/'
          ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
          test -f "$APP_DIR/current/index.html"

          # Nginx may use a document root that differs from the setup
          # default. Resolve the active HD Manager root before declaring
          # the deploy successful, then sync that root when it is a real
          # directory rather than the managed current symlink.
          NGINX_ROOTS="$(nginx -T 2>/dev/null | awk '$1 == "root" {gsub(/;/, "", $2); print $2}' | sort -u || true)"
          if [ -z "$NGINX_ROOTS" ]; then
            NGINX_ROOTS="$APP_DIR/current"
          fi

          MATCHED_ROOT=''
          for ACTIVE_ROOT in $NGINX_ROOTS; do
            [ -f "$ACTIVE_ROOT/index.html" ] || continue
            grep -qi 'HD Manager' "$ACTIVE_ROOT/index.html" || continue
            MATCHED_ROOT="$ACTIVE_ROOT"
            if [ "$ACTIVE_ROOT" = "$APP_DIR/current" ]; then
              ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
            else
              STAGING_ROOT="${ACTIVE_ROOT}.staging-${RELEASE_ID}"
              rm -rf "$STAGING_ROOT"
              mkdir -p "$STAGING_ROOT"
              cp -a "$REMOTE_DIR/." "$STAGING_ROOT/"
              if [ "$ACTIVE_ROOT" = "$APP_DIR" ] && [ -d "$APP_DIR/releases" ]; then
                find "$ACTIVE_ROOT" -mindepth 1 -maxdepth 1 \
                  ! -name releases ! -name current -exec rm -rf {} +
                cp -a "$STAGING_ROOT/." "$ACTIVE_ROOT/"
              else
                rm -rf "$ACTIVE_ROOT"/*
                cp -a "$STAGING_ROOT/." "$ACTIVE_ROOT/"
              fi
              rm -rf "$STAGING_ROOT"
            fi
            break
          done

          test -n "$MATCHED_ROOT"
          test "$(sha256sum "$MATCHED_ROOT/index.html" | cut -d' ' -f1)" = "$EXPECTED_INDEX_SHA"
          rm -rf "$REMOTE_DIR" "$REMOTE_TGZ"
          REMOTE_DEPLOY

      - name: Verify production serves this release
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          LOCAL_INDEX_SHA="$(sha256sum dist/index.html | cut -d' ' -f1)"
          PRODUCTION_INDEX_SHA="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "https://app.hdconnect.net/index.html?release=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
          echo "Local index:      ${LOCAL_INDEX_SHA}"
          echo "Production index: ${PRODUCTION_INDEX_SHA}"
          test "${LOCAL_INDEX_SHA}" = "${PRODUCTION_INDEX_SHA}"
