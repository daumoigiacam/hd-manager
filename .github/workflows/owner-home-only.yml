          import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';const m=JSON.parse(process.env.HD_ARTIFACT_MANIFEST);let count=0;function visit(d){for(const x of fs.readdirSync(d,{withFileTypes:true})){if(x.isSymbolicLink())throw Error('SYMLINK');if(x.isDirectory())visit(path.join(d,x.name));else count++;}}visit('.ci-approved-dist');if(count!==m.files)throw Error('FILE_COUNT');for(const f of m.entries){if(createHash('sha256').update(fs.readFileSync(path.join('.ci-approved-dist',f.path))).digest('hex')!==f.sha256)throw Error('ASSET_HASH');}if(JSON.parse(fs.readFileSync('.ci-approved-dist/version.json','utf8')).buildId!==m.sourceCommit)throw Error('VERSION');console.log('All '+count+' CI assets verified');
