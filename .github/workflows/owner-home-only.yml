name: HD Manager isolated sharing browser QA
on:
  push:
    branches:
      - codex/official-home-qa-20261114
permissions:
  contents: read
concurrency:
  group: sharing-browser-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cc5d4bceb33d7c77c676fb035dcf382e05badde6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Verify all repeated Web share cases
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/register-canonical-source.mjs
        run: node --test --test-concurrency=1 --test-timeout=90000 tests/share-delivery.browser.mjs
