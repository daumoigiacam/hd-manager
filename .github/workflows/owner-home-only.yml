                assert not temp.exists() and not temp.is_symlink(), 'LINK_COLLISION'
                os.symlink(str(target),str(temp));os.replace(str(temp),str(CURRENT))

            stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
            try:
                assert str(ZIP).startswith('/var/tmp/hd-manager-home-') and ZIP.is_file() and not ZIP.is_symlink(), 'INVALID_TRANSFER_PATH'
                assert SHA(ZIP.read_bytes())==EXPECTED_ZIP_SHA, 'ARTIFACT_HASH_MISMATCH'
                assert CURRENT.is_symlink(), 'CURRENT_IS_NOT_SYMLINK'
                old=CURRENT.resolve(strict=True)
                assert str(old).startswith(str(BASE/'releases')+'/'), 'OLD_RELEASE_OUT_OF_SCOPE'
                old_version=json.loads((old/'version.json').read_text())
                assert old_version.get('buildId')==OLD_SOURCE, 'PRODUCTION_CHANGED_SINCE_APPROVAL'
                assert public_version()==OLD_SOURCE, 'PUBLIC_PRODUCTION_CHANGED'
                result['identityBefore']=assert_identity()
                with zipfile.ZipFile(ZIP) as archive:
                    entries=archive.infolist()
                    assert entries and sum(e.file_size for e in entries)<160*1024*1024, 'UNEXPECTED_ARTIFACT_SIZE'
                    for e in entries:
                        p=pathlib.PurePosixPath(e.filename)
                        assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename, 'ZIP_PATH_TRAVERSAL'
                        assert not stat.S_ISLNK(e.external_attr>>16), 'ZIP_SYMLINK_NOT_ALLOWED'
                        assert p.name not in ['.env','hdmanager-upload-key.jks'] and not p.name.endswith(('.pem','.p12','.jks')), 'SENSITIVE_ARTIFACT_FILE'
                    assert json.loads(archive.read('version.json')).get('buildId')==SOURCE, 'WRONG_BUNDLE_SOURCE'
                    assert archive.read('index.html').strip(), 'MISSING_INDEX'
                    new_index_sha=SHA(archive.read('index.html'))
                    new=BASE/'releases'/('owner-home-'+SOURCE[:12]+'-'+stamp)
                    assert not new.exists(), 'NEW_RELEASE_EXISTS'
                    budget=sum(e.file_size for e in entries)+16*1024*1024
                    capacity=os.statvfs(BASE)
                    assert not (capacity.f_flag&os.ST_RDONLY) and capacity.f_favail>10000, 'RELEASE_FILESYSTEM_NOT_WRITABLE'
                    physical_free=capacity.f_bfree*capacity.f_frsize
                    ordinary_free=capacity.f_bavail*capacity.f_frsize
                    # shutil.disk_usage.free reports f_bavail, which excludes the existing
                    # root allocation. This is a root-owned static deployment, not a new
                    # backend write path. Never change filesystem reservation settings;
                    # retain at least 2.75 GiB physical free space even after the full budget.
                    assert physical_free-budget>=2.75*1024*1024*1024, 'INSUFFICIENT_PHYSICAL_RELEASE_RESERVE'
                    use_root_capacity=ordinary_free<=budget
                    if use_root_capacity:
                        # Keep the existing deployment directory ownership unchanged. It
                        # need not be owned by root; only the actual writer must be root
                        # to use the already configured privileged filesystem allocation.
                        assert os.geteuid()==0, 'ORDINARY_USER_RELEASE_CAPACITY_UNAVAILABLE'
                        assert physical_free-budget>=2.75*1024*1024*1024, 'INSUFFICIENT_PHYSICAL_RELEASE_RESERVE'
                    result['capacity']={'ordinaryUserFreeBytesBefore':ordinary_free,'physicalFreeBytesBefore':physical_free,'maximumDeploymentBudgetBytes':budget,'minimumPhysicalFreeBytes':2.75*1024*1024*1024,'filesystemReservationChanged':False}
                    backup_dir=pathlib.Path('/var/backups/hd-manager-frontend/20261117T042034553016Z')
                    backup=pathlib.Path('/var/backups/hd-manager-frontend/20261117T042034553016Z/frontend-original.tar.gz')
                    assert backup.is_file() and not backup.is_symlink() and SHA(backup.read_bytes())=='1b5ba0bc521cae3d904c5faa698288958c3825cce08eb874a5db0104e84b07e3', 'PREPARED_BACKUP_CHANGED'
                    before_index_sha=SHA((old/'index.html').read_bytes())
                    assert str(old)=='/var/www/hd-manager/releases/owner-home-06e806680ac0-20261117T032740335644Z' and before_index_sha=='771deae76c4e3c032ee5c70184e15870a4767294bc3740ecd3f476e6991a1c27', 'PREPARED_BACKUP_SOURCE_CHANGED'
                    assert not (backup_dir/'rollback-manifest.json').exists(), 'PREPARED_BACKUP_ALREADY_USED'
                    with tarfile.open(backup,'r:gz') as tar:
                        index=tar.extractfile('./index.html')
                        assert index and SHA(index.read())==before_index_sha, 'BACKUP_INDEX_VERIFICATION_FAILED'
                        version=tar.extractfile('./version.json')
                        assert version and json.load(version).get('buildId')==OLD_SOURCE, 'BACKUP_VERSION_VERIFICATION_FAILED'
                    assert CURRENT.resolve(strict=True)==old and SHA((old/'index.html').read_bytes())==before_index_sha, 'PRODUCTION_CONCURRENT_CHANGE'
                    result.update({'oldRelease':str(old),'oldSourceCommit':OLD_SOURCE,'oldIndexSha256':before_index_sha,'backupPath':str(backup),'backupSha256':SHA(backup.read_bytes()),'newRelease':str(new),'newIndexSha256':new_index_sha,'artifactSha256':EXPECTED_ZIP_SHA})
                    new.mkdir(mode=0o755)
                    archive.extractall(new)
                # Existing open tabs may still lazy-load old content-hashed chunks. Keep
                # those static assets reachable; never replace a new asset or the new index.
                retained=0
                if (old/'assets').is_dir():
                    for source in (old/'assets').rglob('*'):
                        assert not source.is_symlink(), 'UNEXPECTED_OLD_ASSET_SYMLINK'
                        if not source.is_file():continue
                        destination=new/'assets'/source.relative_to(old/'assets')
                        if destination.exists():
                            assert SHA(destination.read_bytes())==SHA(source.read_bytes()), 'IMMUTABLE_ASSET_NAME_COLLISION'
                        else:
                            destination.parent.mkdir(parents=True,exist_ok=True)
                            os.link(source,destination);retained+=1
                result['retainedLegacyStaticAssets']=retained
                for root,dirs,files in os.walk(new):
                    os.chmod(root,0o755)
                    for name in files:os.chmod(pathlib.Path(root)/name,0o644)
                manifest=backup_dir/'rollback-manifest.json'
                manifest.write_text(json.dumps(result,indent=2));os.chmod(manifest,0o600)
                assert os.statvfs(BASE).f_bfree*os.statvfs(BASE).f_frsize>=2.75*1024*1024*1024, 'PHYSICAL_RESERVE_BEFORE_ACTIVATION_FAILED'
                assert CURRENT.resolve(strict=True)==old, 'CONCURRENT_ACTIVATION'
                swap_link(new);result['activated']=True
                assert CURRENT.resolve(strict=True)==new, 'ACTIVATION_LINK_MISMATCH'
                assert public_version()==SOURCE, 'PUBLIC_NEW_VERSION_MISMATCH'
                status,headers,index=fetch('/?owner_home_check='+stamp)
                assert status==200 and SHA(index)==new_index_sha, 'PUBLIC_INDEX_HASH_MISMATCH'
                result['identityAfter']=assert_identity()
                result['capacity']['physicalFreeBytesAfter']=os.statvfs(BASE).f_bfree*os.statvfs(BASE).f_frsize
                assert result['capacity']['physicalFreeBytesAfter']>=2.75*1024*1024*1024, 'PHYSICAL_RESERVE_AFTER_ACTIVATION_FAILED'
                result['publicVersion']=SOURCE
                result['status']='FRONTEND_DEPLOYED_AWAITING_AUTHENTICATED_SMOKE'
                result['rollbackManifest']=str(manifest)
                (backup_dir/'deployment-result.json').write_text(json.dumps(result,indent=2));os.chmod(backup_dir/'deployment-result.json',0o600)
            except Exception as e:
                result['error']=str(e)[:350]
                result['status']='BLOCKED_BEFORE_FRONTEND_CHANGE' if not result['activated'] else 'ACTIVATION_VERIFY_FAILED'
                if result['activated']:
                    try:
                        assert CURRENT.resolve(strict=True)==new, 'ROLLBACK_BLOCKED_CONCURRENT_OPERATOR_CHANGE'
                        assert old.is_dir() and SHA((old/'index.html').read_bytes())==before_index_sha, 'OLD_RELEASE_CHANGED'
                        swap_link(old)
                        assert public_version()==OLD_SOURCE, 'ROLLBACK_PUBLIC_VERSION_FAILED'
                        result['status']='FRONTEND_ROLLED_BACK'
                    except Exception as rollback_error:result['rollbackError']=str(rollback_error)[:350]
            print(json.dumps(result))
          FRONTEND_ZIP: ${{ runner.temp }}/hd-manager-order-date-frontend.zip
        run: |-
          node --input-type=module <<'HD_APPROVED_ORDER_DATE_DEPLOY'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import dns from 'node:dns/promises';
          import {execFileSync} from 'node:child_process';
          import {createHash,randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const dir=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP||os.tmpdir(),'hd-owner-frontend-'));
          const keyFile=path.join(dir,'ci-key'),known=path.join(dir,'known_hosts');
          let result,keyFormat;
          try {
           const host=process.env.VPS_HOST?.trim(),user=process.env.VPS_USER?.trim(),key=process.env.VPS_SSH_KEY;
           if(!/^[a-zA-Z0-9.-]+$/.test(host||'')||!/^[a-z_][a-z0-9_-]*\$?$/i.test(user||'')||!key)throw Error('AUTHORIZED_SSH_CONFIGURATION_MISSING');
           const configured=await dns.lookup(host,{all:true}),app=await dns.lookup('app.hdconnect.net',{all:true});
           if(!configured.some(x=>app.some(y=>x.address===y.address)||x.address==='180.93.0.87'))throw Error('CONFIGURED_HOST_NOT_PRODUCTION_DNS_OR_APPROVED_VPS');
           let material=key.replace(/\r\n?/g,'\n');
           keyFormat={lines:material.split('\n').length,hasPemBoundary:/-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(material),hasEscapedNewlines:material.includes('\\n'),trailingNewline:material.endsWith('\n')};
           if(keyFormat.hasPemBoundary&&keyFormat.hasEscapedNewlines&&keyFormat.lines===1)material=material.replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n');
           if(!keyFormat.hasPemBoundary&&/^[A-Za-z0-9+/=\s]+$/.test(material)){
            const decoded=Buffer.from(material,'base64').toString('utf8');
            if(/^-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(decoded)){material=decoded.replace(/\r\n?/g,'\n');keyFormat.explicitBase64Envelope=true;}
           }
           if(!material.endsWith('\n'))material+='\n';
           fs.writeFileSync(keyFile,material,{mode:0o600});material='';delete process.env.VPS_SSH_KEY;
           try{execFileSync('ssh-keygen',['-l','-f',keyFile],{stdio:['ignore','pipe','pipe'],timeout:10000});keyFormat.localParse='PASS';}
           catch{keyFormat.localParse='FAILED';throw Error('EXISTING_SSH_KEY_FORMAT_NOT_READABLE');}
           const pinned=process.env.VPS_KNOWN_HOSTS;
           if(pinned)fs.writeFileSync(known,pinned,{mode:0o600});
           const args=['-i',keyFile,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ConnectTimeout=10','-o','ConnectionAttempts=1','-o','LogLevel=ERROR','-o','RequestTTY=no','-o','StrictHostKeyChecking='+(pinned?'yes':'accept-new'),'-o','UserKnownHostsFile='+known,user+'@'+host,'python3 -'];
           const artifact=process.env.FRONTEND_ZIP;
           if(!artifact||!fs.statSync(artifact).isFile())throw Error('FRONTEND_ARTIFACT_MISSING');
           const artifactHash=createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
           const stagingProbe="import tempfile,os\nfor d in ['/var/www/hd-manager','/var/backups','/var/tmp']:\n s=os.statvfs(d)\n assert not (s.f_flag&os.ST_RDONLY) and s.f_favail>10000, 'UNUSABLE_RELEASE_FILESYSTEM'\n assert s.f_bfree*s.f_frsize-"+fs.statSync(artifact).size+"-34407369>=2.75*1024*1024*1024, 'INSUFFICIENT_RESERVE_BEFORE_TRANSFER'\n assert s.f_bavail*s.f_frsize>34407369 or os.geteuid()==0, 'UNPRIVILEGED_RESERVE_UNAVAILABLE'\np=tempfile.mkdtemp(prefix='hd-manager-home-',dir='/var/tmp'); os.chmod(p,0o700); print(p)\n";
           const staging=execFileSync('ssh',args,{input:stagingProbe,encoding:'utf8',timeout:20000,stdio:['pipe','pipe','pipe']}).trim();
           if(!/^\/var\/tmp\/hd-manager-home-[a-zA-Z0-9_-]+$/.test(staging))throw Error('INVALID_PRIVATE_TRANSFER_PATH');
           execFileSync('scp',[...args.slice(0,-2),artifact,user+'@'+host+':'+staging+'/frontend.zip'],{timeout:90000,stdio:['ignore','pipe','pipe']});
           const remote=process.env.REMOTE_PROBE.replace('__FRONTEND_ZIP_PATH__',staging+'/frontend.zip').replace('__FRONTEND_ZIP_SHA__',artifactHash);
           const stdout=execFileSync('ssh',args,{input:remote,encoding:'utf8',timeout:150000,maxBuffer:2*1024*1024,stdio:['pipe','pipe','pipe']});
           result={status:'SSH_SCOPE_COMPLETED',keyFormat,hostTrust:pinned?'EXISTING_KNOWN_HOSTS':'EXISTING_CI_HOST_MATCHED_PRODUCTION_DNS_FIRST_USE_HOSTKEY',payload:JSON.parse(stdout)};
          } catch(error) {
           result={status:'FRONTEND_OPERATION_FAILED',keyFormat,code:/^[A-Z_]+$/.test(error.message)?error.message:'SSH_OR_PROBE_FAILURE',exitStatus:error.status,stdout:String(error.stdout||'').slice(-20000),stderr:String(error.stderr||'').slice(-12000)};
          } finally {
