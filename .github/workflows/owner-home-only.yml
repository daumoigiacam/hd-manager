          REMOTE_PROBE: |
            import os,sys,json,pathlib,hashlib,tarfile,zipfile,stat,datetime,urllib.request,urllib.error,ssl,tempfile,shutil
            SOURCE='cc5d4bceb33d7c77c676fb035dcf382e05badde6'
            OLD_SOURCE='d22bd3cb7bf4df44e29f3766d4edd326a3ba19ef'
