            result={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Owner-authorized full audited Firebase frontend release; no backend or business-data changes','sourceCommit':SOURCE,'activated':False,'databaseChanged':False,'backendChanged':False,'nginxReloaded':False,'servicesCreated':False}

            def fetch(path,method='GET',payload=None):
                headers={'Cache-Control':'no-cache','Origin':'https://app.hdconnect.net'}
                if method=='OPTIONS':headers.update({'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type,authorization'})
                if payload is not None:headers['Content-Type']='application/json'
                req=urllib.request.Request('https://app.hdconnect.net'+path,method=method,headers=headers,data=json.dumps(payload).encode() if payload is not None else None)
                try:response=urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context())
                except urllib.error.HTTPError as e:response=e
                raw=response.read(4*1024*1024)
                return response.status,response.headers,raw

            def public_version():
                status,headers,raw=fetch('/version.json?owner_home_check='+stamp)
