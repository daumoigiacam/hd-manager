name: Verify official Android signing only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-official-signing-readiness
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore only the original encrypted keystore
        env:
          KEYSTORE_BYTES: ${{ secrets.HD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          if(!process.env.KEYSTORE_BYTES)throw Error('Official encrypted keystore secret is missing');
          const bytes=Buffer.from(process.env.KEYSTORE_BYTES,'base64');
          if(crypto.createHash('sha256').update(bytes).digest('hex')!=='d5d616282282ea86ac1a99247b785fdedec9b93a399a6e3f03037693b236a43d')throw Error('Official keystore mismatch');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/hdmanager-upload-key.jks',bytes,{mode:0o600,flag:'wx'});bytes.fill(0);
          NODE
      - name: Verify private-key nonce and upgrade certificate
        env:
          HD_RELEASE_STORE_FILE: ${{ runner.temp }}/hdmanager-upload-key.jks
          HD_RELEASE_KEY_ALIAS: hdmanager-upload
          HD_RELEASE_STORE_PASSWORD: ${{ secrets.HD_RELEASE_STORE_PASSWORD }}
          HD_RELEASE_KEY_PASSWORD: ${{ secrets.HD_RELEASE_KEY_PASSWORD }}
          HD_SIGNING_REPORT_FILE: android-signing-verification.json
        run: node scripts/android-release-signing-preflight.mjs --require-secrets
      - uses: actions/upload-artifact@v5
        with:
          name: hd-manager-official-signing-proof-${{ github.sha }}
          path: android-signing-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral encrypted keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/hdmanager-upload-key.jks"
