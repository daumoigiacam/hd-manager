name: Read-only Production API 502 investigation
on:
  push:
    branches:
      - codex/api502-readonly-20261114
permissions:
  contents: read
concurrency:
  group: hd-manager-api502-readonly
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read-only gateway metadata and logs; encrypted output only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REPORT_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtxDyOAxYhO2GwTV21CNx
            IYrbN7qPjsbHpPfqe6m8+xsd9ziErcyCBJ1MCOdAIS1PZFSRefzIYa4ZiMQ/G0/4
            6aA/M3NjokY2vz7bovLBrqbSiONPfjPhllUNgStksXhNJ9uyr23+rORcKILGGFiF
            fcYFd8VGl6PD+UBsOp/yBEWOEQnAJOxQ5xgjqNe3S83QRogIpKqgBe9iLyjTo3ZH
            gwa3PpAngHEnO0GT/mZs04FL+GShvqyccl1GBM2po0wSKIE0mq2VKyxVXlcMq5eg
            0L9N9SbD1wPEsiZ/lnqwTVU6LNV0Ja+nPb6ERR/3JYXdMUMZ+XtPEq+DuX3nPGqv
            OlWXT5xKW7bO0FemL//XdEcKXsd1pPZULmACN3WAjlRuyI5HbOdA8PGKHgj0lnM5
            cUxQq2l77zUhDCQEreu9A96MBZJopYfg5WNWsrLBZArPjtYAspQ+4kkA/qmB0WyR
            wOCqgEh4n/8tZa/8zW9kAYQul9xVxWQaSsuZwxE8ioe9AgMBAAE=
            -----END PUBLIC KEY-----
          REMOTE_PROBE: |
            import json, re, subprocess, datetime, ipaddress, urllib.request, urllib.error
            TARGET='172.19.0.2'
            PORT=3000
            OPENER=urllib.request.build_opener(urllib.request.ProxyHandler({}))
            def run(args, timeout=12, limit=1048576):
                try:
                    p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,encoding='utf-8',errors='replace',timeout=timeout)
                    return {'code':p.returncode,'stdout':p.stdout[-limit:],'stderr':p.stderr[-4096:]}
                except Exception as e:return {'code':-1,'error':type(e).__name__}
            def redact(s):
                s=re.sub(r'client:\s*[^,]+','client: [REDACTED]',s)
                s=re.sub(r'(request: "(?:GET|POST|OPTIONS|HEAD)\s+[^?\s"]+)\?[^\s"]+',r'\1?[QUERY_OMITTED]',s)
                s=re.sub(r'referrer:\s*"[^"]*"','referrer: [REDACTED]',s)
                s=re.sub(r'(?i)("(?:password|passwordHash|token|access_token|refresh_token|authorization|cookie|secret|database_url)"\s*:\s*)"[^"\n]*"',r'\1"[REDACTED]"',s)
                s=re.sub(r'(?i)Bearer\s+[A-Za-z0-9_.-]+','Bearer [REDACTED]',s)
                s=re.sub(r'(\w+://)[^\s/@]+:[^\s/@]+@',r'\1[REDACTED]@',s)
                return s
            def technical_log(line):
                try:
                    item=json.loads(line)
                    message=str(item.get('msg',''))
                    error=item.get('err') if isinstance(item.get('err'),dict) else {}
                    request=item.get('req') if isinstance(item.get('req'),dict) else {}
                    route=str(request.get('url','')).split('?')[0]
                    text=message+' '+str(error.get('message',''))
                    if not (route in ['/health','/healthz','/api/identity/login'] or re.search(r'listen|server.*start|bootstrap|fatal|unhandled|ECONN|EADDR|ENOTFOUND',text,re.I)):return None
                    if re.search(r'password|payload|request body|username|customer|order|invoice',message,re.I):message='[NON_TECHNICAL_MESSAGE_OMITTED]'
                    value={k:item.get(k) for k in ['level','time'] if k in item}
                    value['message']=redact(message)[:600]
                    if route:value['route']=route
                    if error:value['error']={k:redact(str(error.get(k,'')))[:1200] for k in ['type','code','message','stack'] if k in error}
                    return json.dumps(value,ensure_ascii=False)
                except Exception:
                    if not re.search(r'listen|server.*start|bootstrap|fatal|unhandled|ECONN|EADDR|ENOTFOUND|/health|/api/identity/login',line,re.I):return None
                    if re.search(r'password|payload|request body|username|customer|invoice|INSERT INTO|UPDATE |SELECT ',line,re.I):return '[NON_TECHNICAL_LOG_LINE_OMITTED]'
                    return redact(line)[:1200]
            def probe(url):
                try:
                    with OPENER.open(urllib.request.Request(url,method='GET'),timeout=4) as r:code=r.status;body=r.read(2048).decode('utf-8','replace')
                except urllib.error.HTTPError as e:code=e.code;body=e.read(2048).decode('utf-8','replace')
                except Exception as e:return {'url':url,'error':type(e).__name__,'reason':redact(str(e))[:180]}
                try:
                    j=json.loads(body)
                    keep={k:j[k] for k in ['status','success','service','version','message','code'] if k in j and isinstance(j[k],(str,bool,int,float))}
                    if isinstance(j.get('error'),dict):keep['error']={k:j['error'][k] for k in ['code','message'] if k in j['error']}
                except Exception:keep={'bodyKind':'html' if '<html' in body.lower() else 'non-json'}
                return {'url':url,'status':code,'response':keep}
            result={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'readOnly':True,'target':TARGET+':'+str(PORT)}
            result['route']=run(['ip','route','get',TARGET])
            result['neighbor']=run(['ip','neigh','show',TARGET])
            result['listeners']=run(['sudo','-n','ss','-ltnp'])
            result['listeners']['stdout']='\n'.join(x for x in result['listeners'].get('stdout','').splitlines() if re.search(r':(?:3000|80|443)\s',x))
            result['nginxErrors']=[]
            for file in ['/var/log/nginx/error.log']:
                logs=run(['sudo','-n','tail','-n','2500',file],limit=1048576)
                lines=[redact(x) for x in logs.get('stdout','').splitlines() if '/api/identity/login' in x and 'app.hdconnect.net' in x]
                result['nginxErrors'].append({'file':file,'code':logs.get('code'),'lines':lines[-22:]})
            ps=run(['sudo','-n','docker','ps','-a','--format','{{json .}}'])
            result['dockerQuery']={k:v for k,v in ps.items() if k!='stdout'}
            containers=[];networks={};candidates=[]
            for line in ps.get('stdout','').splitlines():
                try:item=json.loads(line)
                except Exception:continue
                ins=run(['sudo','-n','docker','inspect','--format','{{json .NetworkSettings.Networks}}',item['ID']])
                try:nets=json.loads(ins.get('stdout','{}')) or {}
                except Exception:nets={}
                for name,net in nets.items():networks[name]=net.get('NetworkID')
                ipmatch=any(net.get('IPAddress')==TARGET for net in nets.values())
                api=bool(re.search(r'api|backend|hd-manager|hdmanager',item.get('Names',''),re.I))
                if not (ipmatch or api or ':3000->' in item.get('Ports','')):continue
                entry={k:item.get(k) for k in ['ID','Names','Image','Status','Ports','Networks']}
                entry['targetIpMatch']=ipmatch
                entry['addresses']={name:{k:net.get(k) for k in ['IPAddress','Gateway','Aliases']} for name,net in nets.items()}
                state=run(['sudo','-n','docker','inspect','--format','{{json .State}}',item['ID']])
                try:
                    st=json.loads(state.get('stdout','{}'));entry['state']={k:st.get(k) for k in ['Status','Running','Restarting','OOMKilled','ExitCode','Error','Pid','StartedAt','FinishedAt']};entry['health']=st.get('Health',{}).get('Status')
                except Exception:entry['inspectFailed']=True
                if api:
                    logs=run(['sudo','-n','docker','logs','--since','2h','--tail','120',item['ID']],limit=131072)
                    lines=(logs.get('stdout','')+'\n'+logs.get('stderr','')).splitlines()
                    entry['applicationLogEvidence']=[value for value in (technical_log(x) for x in lines) if value][-22:]
                    for net in nets.values():
                        ip=net.get('IPAddress')
                        if ip and re.match(r'^(?:10\.|172\.(?:1[6-9]|2\d|3[01])\.|192\.168\.)',ip):candidates.append(ip)
                containers.append(entry)
            result['containers']=containers
            result['networksContainingTarget']=[]
            for name,identifier in networks.items():
                if not identifier:continue
                r=run(['sudo','-n','docker','network','inspect','--format','{{json .IPAM.Config}}',identifier])
                try:cfg=json.loads(r.get('stdout','[]')) or []
                except Exception:continue
                matches=False
                for item in cfg:
                    try:matches=matches or ipaddress.ip_address(TARGET) in ipaddress.ip_network(item.get('Subnet',''),strict=False)
                    except Exception:pass
                if not matches:continue
                peers=run(['sudo','-n','docker','network','inspect','--format','{{json .Containers}}',identifier])
                try:peers=json.loads(peers.get('stdout','{}')) or {}
                except Exception:peers={}
                result['networksContainingTarget'].append({'name':name,'ipam':cfg,'peers':[{k:p.get(k) for k in ['Name','IPv4Address']} for p in peers.values()]})
            urls=['http://'+TARGET+':3000/health','http://'+TARGET+':3000/api/identity/login','http://127.0.0.1:3000/health']
            for ip in sorted(set(candidates))[:5]:
                if ip!=TARGET:urls+=['http://'+ip+':3000/health','http://'+ip+':3000/api/identity/login']
            result['httpProbes']=[probe(url) for url in urls]
            result['identityFunction']=probe('https://us-central1-hd-manager-c5839.cloudfunctions.net/identityLogin')
            result['safety']='Read-only config/log/metadata and GET only. No restart, deployment, environment read, secret change or database request.'
            print(json.dumps(result,ensure_ascii=False))
        run: |-
          node --input-type=module <<'HD_READONLY_NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import dns from 'node:dns/promises';
          import {execFileSync} from 'node:child_process';
          import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const dir=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP||os.tmpdir(),'hd502-readonly-'));
          const keyFile=path.join(dir,'ci-key'),known=path.join(dir,'known_hosts');
          let result,keyFormat;
          try {
           const host=process.env.VPS_HOST?.trim(),user=process.env.VPS_USER?.trim(),key=process.env.VPS_SSH_KEY;
           if(!/^[a-zA-Z0-9.-]+$/.test(host||'')||!/^[a-z_][a-z0-9_-]*\$?$/i.test(user||'')||!key)throw Error('AUTHORIZED_SSH_CONFIGURATION_MISSING');
           const configured=await dns.lookup(host,{all:true}),app=await dns.lookup('app.hdconnect.net',{all:true});
           if(!configured.some(x=>app.some(y=>x.address===y.address)||x.address==='180.93.0.87'))throw Error('CONFIGURED_HOST_NOT_PRODUCTION_DNS_OR_APPROVED_VPS');
           let material=key.replace(/\r\n?/g,'\n');
           keyFormat={lines:material.split('\n').length,hasPemBoundary:/-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(material),hasEscapedNewlines:material.includes('\\n'),trailingNewline:material.endsWith('\n')};
           if(keyFormat.hasPemBoundary&&keyFormat.hasEscapedNewlines&&keyFormat.lines===1)material=material.replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n');
           if(!keyFormat.hasPemBoundary&&/^[A-Za-z0-9+/=\s]+$/.test(material)){
            const decoded=Buffer.from(material,'base64').toString('utf8');
            if(/^-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(decoded)){material=decoded.replace(/\r\n?/g,'\n');keyFormat.explicitBase64Envelope=true;}
           }
           if(!material.endsWith('\n'))material+='\n';
           fs.writeFileSync(keyFile,material,{mode:0o600});material='';delete process.env.VPS_SSH_KEY;
           try{execFileSync('ssh-keygen',['-l','-f',keyFile],{stdio:['ignore','pipe','pipe'],timeout:10000});keyFormat.localParse='PASS';}
           catch{keyFormat.localParse='FAILED';throw Error('EXISTING_SSH_KEY_FORMAT_NOT_READABLE');}
           const pinned=process.env.VPS_KNOWN_HOSTS;
           if(pinned)fs.writeFileSync(known,pinned,{mode:0o600});
           const args=['-i',keyFile,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ConnectTimeout=10','-o','ConnectionAttempts=1','-o','LogLevel=ERROR','-o','RequestTTY=no','-o','StrictHostKeyChecking='+(pinned?'yes':'accept-new'),'-o','UserKnownHostsFile='+known,user+'@'+host,'python3 -'];
           const stdout=execFileSync('ssh',args,{input:process.env.REMOTE_PROBE,encoding:'utf8',timeout:150000,maxBuffer:2*1024*1024,stdio:['pipe','pipe','pipe']});
           result={status:'SSH_READ_COMPLETED',keyFormat,hostTrust:pinned?'EXISTING_KNOWN_HOSTS':'EXISTING_CI_HOST_MATCHED_PRODUCTION_DNS_FIRST_USE_HOSTKEY',payload:JSON.parse(stdout)};
          } catch(error) {
           result={status:'READ_DIAGNOSTIC_FAILED',keyFormat,code:/^[A-Z_]+$/.test(error.message)?error.message:'SSH_OR_PROBE_FAILURE',exitStatus:error.status,stdout:String(error.stdout||'').slice(-20000),stderr:String(error.stderr||'').slice(-12000)};
          } finally {
           for(const file of [keyFile,known])try{fs.unlinkSync(file);}catch{}
           try{fs.rmdirSync(dir);}catch{}
          }
          const aes=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',aes,iv);
          const ciphertext=Buffer.concat([cipher.update(JSON.stringify(result),'utf8'),cipher.final()]);
          const meta={version:1,wrappedKey:publicEncrypt({key:process.env.REPORT_PUBLIC_KEY,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},aes).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64')};
          aes.fill(0);console.log('HD502_META '+JSON.stringify(meta));
          const encoded=ciphertext.toString('base64'),parts=Math.ceil(encoded.length/6000);
          for(let i=0;i<parts;i++)console.log('HD502_PART '+i+' '+parts+' '+encoded.slice(i*6000,(i+1)*6000));
          console.log('HD502_STATUS '+result.status);
          if(result.status!=='SSH_READ_COMPLETED')process.exitCode=1;

          HD_READONLY_NODE
