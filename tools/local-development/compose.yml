name: hdmanager-offline-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdmanager_local
      POSTGRES_DB: hdmanager_local
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_local:/var/lib/postgresql/data"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdmanager_local -d hdmanager_local"]
      interval: 5s
      timeout: 3s
      retries: 24
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["127.0.0.1:56379:6379"]
    volumes:
      - "redis_local:/data"
      - "../../.local-dev/private/redis.conf:/usr/local/etc/redis/redis.conf:ro"
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf) ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 24
secrets:
  postgres_password:
    file: ../../.local-dev/private/postgres-password.txt
volumes:
  postgres_local:
  redis_local:
